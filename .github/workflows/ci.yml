name: CI

# PR-time gate: runs the exact same deterministic checks as the pre-deploy gate in deploy-api.yml, so a
# red suite blocks the merge instead of being discovered after it lands on main (CI-01). No secrets and
# no deploy — safe for pull requests and manual checks during maintenance.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check framework security floors
        run: pnpm --filter @beedle/web check:framework-security

      - name: Check generated Worker bindings and runtime types
        run: |
          pnpm --filter @beedle/api types:check
          pnpm --filter @beedle/api types:migration:check

      - name: Lint external and async boundaries
        run: pnpm --filter @beedle/api lint

      - name: Verify type and lint contracts reject unsafe fixtures
        run: pnpm --filter @beedle/api test:contracts

      - name: Typecheck API
        run: pnpm --filter @beedle/api typecheck

      - name: Typecheck web
        run: pnpm --filter @beedle/web typecheck

      - name: Test API phrase relevance + queryability gate
        run: pnpm --filter @beedle/api exec node --test ./tests/search-phrase-relevance.test.mjs ./tests/retrieval-search-queryability-gate.test.mjs

      - name: Test API behavior
        run: pnpm --filter @beedle/api test:behavior

      - name: Test frozen production capture checkpoints
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 apps/api/tests/frozen-capture.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 apps/api/tests/parallel-recovery-objects.test.py

      - name: Test API source guards
        run: pnpm --filter @beedle/api test:source

      - name: Test API util suites
        run: pnpm --filter @beedle/api test:utils

      - name: Test web suites
        run: pnpm --filter @beedle/web test:web

  runtime-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Typecheck integration entrypoint
        run: pnpm --filter @beedle/api test:integration:types
      - name: Native Worker migrations, D1, R2 and Queue failures
        run: pnpm --filter @beedle/api test:integration
      - name: Install pinned browser
        run: pnpm --filter @beedle/web exec playwright install --with-deps chromium
      - name: Build the actual Pages adapter output
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8819
          NEXT_TELEMETRY_DISABLED: "1"
          VERCEL_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @beedle/web pages:build
      - name: Search, reviewer races and browser chat recovery through the Pages output
        env:
          BEEDLE_E2E_ADAPTER: pages
          WRANGLER_SEND_METRICS: "false"
        run: pnpm --filter @beedle/web test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: output/playwright/
          retention-days: 7
